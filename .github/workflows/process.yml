name: Image Processing Pipeline

on:
  push:
    paths:
      - 'uploads/**'

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install Pillow
      - name: List changed images
        run: git diff --name-only HEAD^ HEAD -- 'uploads/*.jpg' 'uploads/*.jpeg' 'uploads/*.png' > changed_files.txt
      - name: Process images
        run: python scripts/process_image.py
      - name: Configure git identity
        run: git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Commit processed image back
        run: git add processed/ && git commit -m "Auto-process uploaded image" --allow-empty-message || echo "Nothing to commit"
      - name: Push changes
        run: git push
